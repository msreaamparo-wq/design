[auth]
enabled = true
providers = ["email"]

[ai]
required = true
providers = ["anthropic", "google"]
description = "AI provider key for THREADS AI outfit styling and generated fashion concepts. Configure an Anthropic key for the current stylist model and a compatible image model provider for design visuals."

[db.tables.profiles]
read = "own"
write = "own"
[db.tables.user_preferences]
read = "own"
write = "own"
[db.tables.wardrobe_items]
read = "own"
write = "own"
[db.tables.outfits]
read = "own"
write = "own"
[db.tables.custom_designs]
read = "own"
write = "own"
[db.tables.virtual_tryons]
read = "own"
write = "own"
[db.tables.fabric_uploads]
read = "own"
write = "own"
[db.tables.redesign_projects]
read = "own"
write = "own"
[db.tables.ai_conversations]
read = "own"
write = "own"
[db.tables.ai_messages]
read = "own"
write = "own"
[db.tables.saved_collections]
read = "own"
write = "own"
[db.tables.collection_items]
read = "own"
write = "own"
[db.tables.favorites]
read = "own"
write = "own"
[db.tables.ai_generation_logs]
read = "own"
write = "own"
[db.tables.reports]
read = "own"
write = "own"
[db.tables.notifications]
read = "own"
write = "own"
[db.tables.app_admins]
read = "own"
write = "own"
[db.tables.admin_activity_logs]
read = "own"
write = "own"
owner_column = "actor_user_id"
[db.tables.api_rate_limits]
read = "own"
write = "own"

[[secret]]
name = "FASHN_API_KEY"
required = false
description = "FASHN API key for real virtual try-on. Create a key in the FASHN developer dashboard and paste it here; it stays server-side."